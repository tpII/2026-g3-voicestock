[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicestock"
version = "0.1.0"
description = "Voice-assisted inventory management system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VoiceStock contributors" },
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
]

[tool.ruff.lint.isort]
known-first-party = ["voicestock"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["voicestock"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
