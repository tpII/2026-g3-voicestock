[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicestock"
version = "0.1.0"
description = "Voice-assisted inventory management system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VoiceStock contributors" },
]
dependencies = [
    "fastapi==0.142.2",
    "gpiozero>=2.0.1",
    "httpx==0.28.1",
    "sounddevice>=0.5.2",
    "uvicorn==0.54.0",
]

[project.scripts]
voicestock-pc-server = "pc.main:main"
voicestock-pi-client = "pi.main:main"
voicestock-pi-ptt = "pi.push_to_talk.manual:main"
voicestock-pi-web = "pi.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pc", "src/pi", "src/shared"]

[tool.hatch.build.targets.wheel.force-include]
"src/pi/web/static/index.html" = "pi/web/static/index.html"
"src/pi/web/static/styles.css" = "pi/web/static/styles.css"
"src/pi/web/static/app.js" = "pi/web/static/app.js"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # import sorting
]

[tool.ruff.lint.isort]
known-first-party = ["pc", "pi", "shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pc", "pi", "shared"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
